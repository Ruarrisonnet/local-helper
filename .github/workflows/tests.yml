name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.13"]
        include:
          - os: ubuntu-22.04
            python: "3.8"
          - os: windows-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m py_compile server.py outline.py enforce.py install.py
      - name: Unit tests
        run: python test_units.py
      - name: Hook tests
        run: python test_enforce.py
      - name: Server tests (no Ollama on CI, so model checks are reported as SKIP)
        run: python test_server.py
